openapi: 3.0.3

info:
  title: User Service API
  description: REST API for managing users.
  version: 1.0.0

servers:
  - url: http://localhost:3203
    description: Local development server

tags:
  - name: General
    description: General API operations
  - name: Users
    description: User management operations

paths:
  /:
    get:
      tags:
        - General
      summary: Get welcome page
      description: Returns the welcome page of the User service.
      operationId: getHome
      responses:
        "200":
          description: Welcome page.
          content:
            text/html:
              schema:
                type: string
              example: "<h1 style='color:blue'>Welcome to the User service!</h1>"

  /json:
    get:
      tags:
        - Users
      summary: List users
      description: Returns all users, including their passwords when present.
      operationId: listUsers
      responses:
        "200":
          description: List of users.
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"

  /register:
    post:
      tags:
        - Users
      summary: Create a user
      description: >
        Creates a new user. The ID is derived from the name, the role is set
        to user, and the password is omitted from the response.
      operationId: createUser
      requestBody:
        description: User to create.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
            example:
              name: "Jane Doe"
              password: "example-password"
      responses:
        "201":
          description: User successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "jane_doe"
                name: "Jane Doe"
                role: "user"
                last_active: 1360031010
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A user with this normalized name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "User name already exists"
        "415":
          description: The request content type is not JSON.

  /login:
    post:
      tags:
        - Users
      summary: Authenticate a user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                properties:
                  access_token:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: The request content type is not JSON.

  /auth/verify:
    get:
      tags:
        - Users
      summary: Verify a token and retrieve the user's role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The token is valid and the user still exists.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - role
                properties:
                  id:
                    type: string
                  role:
                    type: string
        "401":
          description: Missing or expired token, or the user no longer exists.
        "422":
          description: Invalid token.

  /user/{user_id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Returns a user matching the specified user ID, including the password when present.
      operationId: getUserById
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User matching the specified ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "chris_rivers"
                name: "Chris Rivers"
                password: "example-password"
                role: "admin"
                last_active: 1360031010
        "404":
          description: User with the specified ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "User id not found"

    put:
      tags:
        - Users
      summary: Update user
      description: Updates the name and last active timestamp, then returns the user including the password when present.
      operationId: updateUser
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        description: Updated user information.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
            example:
              name: "Chris Rivers"
              last_active: 1360032000
      responses:
        "201":
          description: User successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "chris_rivers"
                name: "Chris Rivers"
                password: "example-password"
                role: "admin"
                last_active: 1360032000
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: User with the specified ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "User id not found"
        "415":
          description: The request content type is not JSON.

    delete:
      tags:
        - Users
      summary: Delete user
      description: Users can delete their own account; admins can delete any account.
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: User successfully deleted.
        "401":
          description: Missing or expired token, or the authenticated user no longer exists.
        "403":
          description: The authenticated user cannot delete this account.
        "404":
          description: User with the specified ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "User id not found"
        "422":
          description: Invalid token.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: user_id
      in: path
      description: Unique identifier of the user.
      required: true
      schema:
        type: string
        minLength: 1
      example: "chris_rivers"

  schemas:
    User:
      type: object
      description: A user.
      required:
        - id
        - name
        - last_active
      properties:
        id:
          type: string
          description: Unique identifier of the user.
          example: "chris_rivers"
        name:
          description: Full name of the user. The update route does not validate its type.
          example: "Chris Rivers"
        password:
          description: Password, returned by the user listing, consultation and update routes when present.
          example: "example-password"
        role:
          type: string
          enum: [user, admin]
          description: Existing users without a role are treated as users.
        last_active:
          description: Last active value. It is not type-checked by the service.
          example: 1360031010

    UserCreate:
      type: object
      description: Credentials used to register or log in.
      required:
        - name
        - password
      properties:
        name:
          type: string
          description: Full name of the user. Empty strings are not rejected.
          example: "Chris Rivers"
        password:
          description: Password. The service requires a non-null value but does not validate its type or reject empty strings.
          example: "example-password"
        last_active:
          description: Optional value for registration; defaults to the current Unix timestamp when omitted.
          example: 1360031010

    UserUpdate:
      type: object
      description: Data required to update a user.
      required:
        - name
        - last_active
      properties:
        name:
          description: Full name of the user. The service requires a non-null value but does not validate its type.
          example: "Chris Rivers"
        last_active:
          description: Last active value. The service requires a non-null value but does not validate its type.
          example: 1360032000

    Error:
      type: object
      description: Error response.
      required:
        - error
      properties:
        error:
          type: string
          description: Description of the error.
          example: "User id not found"

  responses:
    BadRequest:
      description: The JSON is malformed or required data is missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "No data provided for the field name"
        text/html:
          schema:
            type: string
            description: Flask returns an HTML error page for malformed JSON.
