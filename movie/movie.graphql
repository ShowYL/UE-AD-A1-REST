type Query {
    movie_with_id(_id: String!): Movie
}

type Mutation {
    update_movie_rate(_id: String!, _rate: Float!): Movie
    update_movie(_id: String!, _title: String, _rating: Float, _director: String): Movie
    create_movie(_id: String!, _title: String!, _rating: Float!, _director: String!): Movie
    delete_movie(_id: String!): String
}

type Movie {
    title: String!
    rating: Float!
    director: String!
    id: String!
    actors: [ Actor ]
}

type Actor {
    id: String!
    firstname: String!
    lastname: String!
    birthyear: Int!
    films: [ String! ]
}
