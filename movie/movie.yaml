openapi: 3.0.3

info:
  title: Movie Service API
  description: REST API for managing movies.
  version: 1.0.0

servers:
  - url: http://localhost:3200
    description: Local development server

tags:
  - name: General
    description: General API operations
  - name: Movies
    description: Movie management operations

paths:
  /:
    get:
      tags:
        - General
      summary: Get welcome page
      description: Returns the welcome page of the Movie service.
      operationId: getHome
      responses:
        "200":
          description: Welcome page.
          content:
            text/html:
              schema:
                type: string
              example: "<h1 style='color:blue'>Welcome to the Movie service!</h1>"

  /json:
    get:
      tags:
        - Movies
      summary: Get all movies
      description: Returns all movies.
      operationId: getMovies
      responses:
        "200":
          description: List of all movies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movie"
              example:
                - title: "The Good Dinosaur"
                  rating: 7.4
                  director: "Peter Sohn"
                  id: "720d006c-3a57-4b6a-b18f-9b713b073f3c"

  /movies:
    get:
      tags:
        - Movies
      summary: Get movie by title
      description: Returns a movie matching the specified title.
      operationId: getMovieByTitle
      parameters:
        - name: title
          in: query
          description: Exact title of the movie to find.
          required: true
          schema:
            type: string
            minLength: 1
          example: "The Martian"
      responses:
        "200":
          description: Movie matching the specified title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
              example:
                title: "The Martian"
                rating: 8.2
                director: "Ridley Scott"
                id: "a8034f44-aee4-44cf-b32c-74cf452aaaae"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Movie with the specified title was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Movie title not found"

    post:
      tags:
        - Movies
      summary: Create a movie
      description: Creates a new movie.
      operationId: createMovie
      requestBody:
        description: Movie to create.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieCreate"
            example:
              title: "The Martian"
              rating: 8.2
              director: "Ridley Scott"
              id: "a8034f44-aee4-44cf-b32c-74cf452aaaae"
      responses:
        "201":
          description: Movie successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
              example:
                title: "The Martian"
                rating: 8.2
                director: "Ridley Scott"
                id: "a8034f44-aee4-44cf-b32c-74cf452aaaae"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A movie with this ID already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Movie id exist"

  /movies/{movie_id}:
    get:
      tags:
        - Movies
      summary: Get movie by ID
      description: Returns a movie matching the specified movie ID.
      operationId: getMovieById
      parameters:
        - $ref: "#/components/parameters/MovieId"
      responses:
        "200":
          description: Movie matching the specified ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
              example:
                title: "The Martian"
                rating: 8.2
                director: "Ridley Scott"
                id: "a8034f44-aee4-44cf-b32c-74cf452aaaae"
        "404":
          description: Movie with the specified ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Movie id not found"

    put:
      tags:
        - Movies
      summary: Update movie
      description: Updates the title, rating, and director of a movie.
      operationId: updateMovie
      parameters:
        - $ref: "#/components/parameters/MovieId"
      requestBody:
        description: Updated movie information.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieUpdate"
            example:
              title: "The Martian"
              rating: 8.5
              director: "Ridley Scott"
      responses:
        "200":
          description: Movie successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Movie with the specified ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Movie id not found"

    delete:
      tags:
        - Movies
      summary: Delete movie
      description: Deletes a movie matching the specified movie ID.
      operationId: deleteMovie
      parameters:
        - $ref: "#/components/parameters/MovieId"
      responses:
        "204":
          description: Movie successfully deleted.
        "404":
          description: Movie with the specified ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Movie id not found"

  /movies/{movie_id}/{rate}:
    patch:
      tags:
        - Movies
      summary: Update movie rating
      description: Updates the rating of a movie.
      operationId: updateMovieRating
      parameters:
        - $ref: "#/components/parameters/MovieId"
        - name: rate
          in: path
          description: New rating for the movie.
          required: true
          schema:
            type: number
            format: float
          example: 8.5
      responses:
        "200":
          description: Movie rating successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "404":
          description: Movie with the specified ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Movie id not found"

components:
  parameters:
    MovieId:
      name: movie_id
      in: path
      description: UUID identifying the movie.
      required: true
      schema:
        type: string
        format: uuid
      example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"

  schemas:
    Movie:
      type: object
      description: A movie.
      required:
        - id
        - title
        - rating
        - director
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the movie.
          example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
        title:
          type: string
          minLength: 1
          description: Title of the movie.
          example: "The Martian"
        rating:
          type: number
          format: float
          description: Rating of the movie.
          example: 8.2
        director:
          type: string
          minLength: 1
          description: Director of the movie.
          example: "Ridley Scott"

    MovieCreate:
      type: object
      description: Data required to create a movie.
      required:
        - id
        - title
        - rating
        - director
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the movie.
          example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
        title:
          type: string
          minLength: 1
          description: Title of the movie.
          example: "The Martian"
        rating:
          type: number
          format: float
          description: Rating of the movie.
          example: 8.2
        director:
          type: string
          minLength: 1
          description: Director of the movie.
          example: "Ridley Scott"

    MovieUpdate:
      type: object
      description: Data required to update a movie.
      required:
        - title
        - rating
        - director
      properties:
        title:
          type: string
          minLength: 1
          description: Title of the movie.
          example: "The Martian"
        rating:
          type: number
          format: float
          description: Rating of the movie.
          example: 8.5
        director:
          type: string
          minLength: 1
          description: Director of the movie.
          example: "Ridley Scott"

    Error:
      type: object
      description: Error response.
      required:
        - error
      properties:
        error:
          type: string
          description: Description of the error.
          example: "Movie id not found"

  responses:
    BadRequest:
      description: The request is invalid or required data is missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "No data provided for the field title"
